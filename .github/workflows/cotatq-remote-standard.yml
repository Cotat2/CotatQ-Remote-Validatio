name: CotatQ Remote STANDARD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cotatq-standard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standard:
    name: STANDARD - ${{ matrix.os }} - Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Checkout locked repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_remote_pinned.txt

      - name: Install exact benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_remote_pinned.txt

      - name: Run locked remote STANDARD
        run: python remote_entrypoint_v13.py --mode standard --runner-label "github-${{ runner.os }}-${{ runner.arch }}"

      - name: Build compact summary
        if: always()
        run: python summarize_remote_v13.py --mode standard

      - name: Bundle all evidence
        if: always()
        run: python bundle_remote_v13.py --mode standard

      - name: Upload complete evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotatq-v13-standard-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            remote_output/**
            results_v122_reproduction_standard/**
            results_v122_strong_standard/**
            doctor_v122_latest.json
            aer_mps_diagnostic_v122_latest.json
            PROTOCOL_LOCK.json
            LOCKED_CASE_MANIFESTS.json
            FROZEN_SUBJECT_HASHES.json
            PATCH_LOCK_v122.json
            REMOTE_PROTOCOL_LOCK_v13.json
