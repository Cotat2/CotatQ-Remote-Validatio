name: CotatQ Remote DOCTOR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Doctor - ${{ matrix.os }} - Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_remote_pinned.txt
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_remote_pinned.txt
      - name: Run doctor only
        run: python remote_entrypoint_v13.py --mode doctor --runner-label "github-${{ runner.os }}-${{ runner.arch }}"
      - name: Bundle doctor evidence
        if: always()
        run: python bundle_remote_v13.py --mode doctor
      - name: Upload doctor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cotatq-v13-doctor-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          retention-days: 30
          path: |
            remote_output/**
            doctor_v122_latest.json
            aer_mps_diagnostic_v122_latest.json
            REMOTE_PROTOCOL_LOCK_v13.json
